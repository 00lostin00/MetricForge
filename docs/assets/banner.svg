<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description"><title id="title">MetricForge 指标交付与验证工作台</title><desc id="description">契约、候选、参考验证、反例缩减与交付的流程示意</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dce6d6" stroke-width=".5"/></pattern></defs><rect width="1200" height="340" rx="22" fill="#f5f7ee"/><rect x="590" width="610" height="340" fill="url(#grid)"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="48" y="42" width="48" height="48" rx="13" fill="#146e57"/><path d="M59 74V59l8 10 8-15 10 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="111" y="73" fill="#20322b" font-size="25" font-weight="650">MetricForge</text><text x="48" y="149" fill="#20322b" font-size="37" font-weight="600">让每个指标，都有验证依据。</text><text x="48" y="190" fill="#788773" font-size="17">从指标契约，到反例、修订与可追溯交付。</text><rect x="48" y="239" width="232" height="34" rx="17" fill="#e4f0de"/><text x="67" y="261" fill="#146e57" font-size="12">Typed DSL · Decimal · Tool Calling</text><path d="M737 170h34m115 0h34" stroke="#9abc8d" stroke-width="2" stroke-dasharray="5 5"/><rect x="647" y="118" width="108" height="110" rx="15" fill="white" stroke="#d7e5ce"/><rect x="788" y="118" width="108" height="110" rx="15" fill="white" stroke="#bdd2b1"/><rect x="929" y="118" width="108" height="110" rx="15" fill="#146e57"/><text x="689" y="162" fill="#9cad8e" font-size="24">ƒ</text><text x="668" y="199" fill="#5c7352" font-size="14">指标契约</text><text x="830" y="164" fill="#146e57" font-size="25">✓</text><text x="808" y="199" fill="#5c7352" font-size="14">参考验证</text><path d="m962 167 11-13 9 7 15-22" fill="none" stroke="#cde2ad" stroke-width="3" stroke-linecap="round"/><text x="949" y="199" fill="white" font-size="14">验收交付</text><rect x="786" y="246" width="112" height="33" rx="10" fill="#f9f0dc" stroke="#e7