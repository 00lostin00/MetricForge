<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">MetricForge：业务契约、候选表达式和独立参考验证</title>
<rect width="1200" height="300" fill="#0b1119"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="50" fill="#dfeaf6" font-size="29" font-weight="600">MetricForge</text><text x="40" y="79" fill="#7e9ab3" font-size="12" letter-spacing="2">FINANCIAL METRIC VALIDATION CONSOLE</text><text x="1160" y="51" text-anchor="end" fill="#8bddbc" font-size="12">CONTRACT / COMPILE / VERIFY</text>
<g stroke="#2c4055" fill="#111c29"><rect x="40" y="108" width="245" height="145" rx="3"/><rect x="303" y="108" width="491" height="145" rx="3"/><rect x="812" y="108" width="348" height="145" rx="3"/></g>
<g fill="#819bb4" font-size="10" letter-spacing="1.2"><text x="58" y="135">01 / CONTRACT</text><text x="321" y="135">02 / CANDIDATES</text><text x="830" y="135">03 / REFERENCE</text></g>
<text x="58" y="165" fill="#d4e4f2" font-size="18">营业收入同比</text><text x="58" y="195" fill="#829eb7" font-size="12">年度、单位与基期约束</text><text x="58" y="222" fill="#8bddbc" font-size="12">返回比率 / 展示百分比</text>
<g font-family="Consolas,monospace" font-size="13"><text x="323" y="172" fill="#daa976">v01  (current - base) / current</text><text x="323" y="209" fill="#8bddbc">v02  (current - base) / base</text></g>
<text x="830" y="169" fill="#c7d9e8" font-size="14">数值 · 状态 · 来源</text><text x="830" y="198" fill="#93b6a7" font-size="12">失败 → 保留反例 → 修订重验</text><text x="830" y="225" fill="#829eb7" font-size="12">通过验收后交付 JSON / HTML / SVG</text>
<text x="40" y="279" fill="#708ba5" font-size="10">图示为工程流程；实际记录见运行报告。Replay 使用固定策略，模型效果单独评测。</text></g></svg>
